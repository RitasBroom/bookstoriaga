<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookstoriaga — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ========================================================================
       LOGIN VIEW (Standalone Entry Point)
       ======================================================================== -->
  <div id="authView" class="auth-wrapper">
    <div class="card auth-card">
      <div class="brand-logo-box">BS</div>
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em;">Bookstoriaga</h1>
        <p class="text-sm text-secondary" id="authSubtitle">Library, Manga & Graphic Novel Inventory</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" autocomplete="username" required />
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" required />
          <button
            type="button"
            id="toggleLoginPasswordBtn"
            class="text-xs font-semibold"
            aria-pressed="false"
            style="align-self: flex-end; color: var(--accent-primary);"
          >View password</button>
        </div>
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-full" style="margin-top: 0.5rem;">Sign In to Workspace</button>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- JavaScript Controller -->
  <script src="app.js"></script>
</body>
</html>
